name: Feature request
description: Propose a scoped capability or safety improvement.
title: "feature: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Describe the problem and evidence before implementation. Provider/framework requests must preserve fail-closed causal verification.
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues and documentation.
          required: true
        - label: This contains no credentials, private data, or vulnerability details.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What concrete workflow is blocked or unsafe?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and examples
      description: Public examples, sanitized output, provider docs, or minimal repository.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired observable outcome and failure behavior
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety and compatibility impact
      description: Address contracts, test-only policy, causal evidence, cleanup, credentials, receipts, and draft publication where relevant.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
