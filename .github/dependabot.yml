version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Los_Angeles
    target-branch: main
    versioning-strategy: increase-if-necessary
    open-pull-requests-limit: 3
    labels: [dependencies]
    groups:
      runtime-patches:
        dependency-type: production
        update-types: [patch]
      development-patches:
        dependency-type: development
        update-types: [patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major, version-update:semver-minor]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/Los_Angeles
    target-branch: main
    open-pull-requests-limit: 2
    labels: [dependencies]
    groups:
      action-patches:
        patterns: ["*"]
        update-types: [patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major, version-update:semver-minor]
